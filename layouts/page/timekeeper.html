<section class='blog {{ $.Params.background }} {{ printf "%s" ((partial "background.html" .) | replaceRE "\\s+" "") }}'>
    <a class="anchor" id="location"></a>
    <div class="container" data-aos="fade-up">

        <div class="section-header">
            <h2>{{ .Title }}</h2>
            {{ .Content }}
        </div>

        <div class="row gy-4 posts-list">

            {{ range seq 6 }}
            {{ $index := . }}
            <div class="col-xl-2 col-lg-4 col-6">
                <article>

                    <div class="post-img" style="position: relative; width: 100%; padding-bottom: 100%; overflow: hidden;">
                        {{ $image := $.Resources.Get (printf "%d.jpg" .)}}
                        {{ with $image }}
                        {{ $thumbnail := .Process "fill 672x672 webp q80" }}
                        <img src="{{ $thumbnail.RelPermalink }}" width="{{ $thumbnail.Width }}" height="{{ $thumbnail.Height }}" loading="lazy" decoding="async" class="img-fluid" alt="The ComoCamp timekeeper in action ({{ $index }} of 6)" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                        {{ end }}
                    </div>

                </article>
            </div><!-- End post list item -->
            {{ end }}

        </div><!-- End blog posts list -->
        
    </div>
  </section><!-- End Blog Section -->
