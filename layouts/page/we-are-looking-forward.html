<section id="we-are-looking-forward" class='{{ $.Params.background }} {{ printf "%s" ((partial "background.html" .) | replaceRE "\\s+" "") }}'>
    <div class="section-header mb-0 p-2">
      <h2>{{ .Title }}</h2>
    </div>
    <div class="container" data-aos="fade-up">

      <div class="row">
        <div class="col-lg-12">
          {{ $image := $.Resources.GetMatch "*" }}
          {{ with $image }}
          {{ $preview := .Process "fit 1600x1600 webp q85" }}
          <a href="{{ .RelPermalink }}" aria-label="View the ComoCamp community group photo in full resolution">
            <img src="{{ $preview.RelPermalink }}" width="{{ $preview.Width }}" height="{{ $preview.Height }}" loading="lazy" decoding="async" class="img-fluid rounded-4 mb-4" alt="ComoCamp community group photo (click for full resolution)">
          </a>
          {{ end }}
        </div>
      </div>

    </div>      
  </section>
