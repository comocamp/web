baseURL = 'https://comocamp.org/'
languageCode = 'en-US'
title = 'ComoCamp 2027'

enableInlineShortcodes = true
enableRobotsTXT = true

# The site is a single page: sections are rendered by layouts/index.html only,
# never as standalone pages. Taxonomies (tags/categories) are not used.
disableKinds = ['taxonomy', 'term']
[outputs]
  home = ['html']
[[cascade]]
  [cascade.build]
    render = 'never'
    list = 'never'
  [cascade.target]
    kind = 'page'

extensions = [
  "hardLineBreak", # newlines result in line breaks
]

[menu]
[[menu.main]]
  name = 'What is the ComoCamp?'
  pageRef = 'como'
  weight = 1
[[menu.main]]
  name = 'Our Location'
  pageRef = 'location'
  weight = 4
[[menu.main]]
  name = 'Our Program'
  pageRef = 'program'
  weight = 5
[[menu.main]]
  name = 'Our Sponsors'
  pageRef = 'supporters'
  weight = 6
[[menu.main]]
name = 'This was our camp 2026!'
pageRef = 'program-hands-on-intro-day'
weight = 7
[[menu.main]]
  name = 'Tickets 2027'
  pageRef = 'participation'
  weight = 8

[Params]
	DateForm = "2006-01-02"
  Sections = ["hero", "como", "camp", "community", "bring-your-topics", "location", "program", "program-hands-on-intro-day", "program-open-space", "timekeeper", "participation", "faqs", "supporters", "supporters-2", "media-partners", "team", "we-are-looking-forward"]

# Save-the-date mode: hides the ticket shop and FAQs until the shop is launched.
[Params.saveTheDate]
  enabled = false

# Tito ticket shop. All Tito URLs live here, so a new edition only needs this block updated.
[Params.tito]
  shop = "https://ti.to/collaborate-vienna/comocamp-2027/with/9dwgwjmgnmg"
  waitinglist = "https://ti.to/collaborate-vienna/comocamp-2027?source=waitinglist"
  smallprint = "https://smallprint.tito.io/collaborate-vienna/comocamp-2027"
